<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<h1>Signup Form</h1>
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" placeholder="name" required>
		<br><br>
		<label for="email">Email</label>
		<input type="email" id="email" placeholder="email" required>
		<br><br>
		<label for="gender_m">Male</label>
		<input type="radio" id="gender_m" name="gender" value="male" required>
		<label for="gender_f">Female</label>
		<input type="radio" id="gender_f" name="gender" value="female" required>
		<br><br>
		<label for="car brands">Car Brands </label>
		<select id="cars" required>
			<option value="">--Please choose an option--</option>
			<option value="BMW">BMW</option>
			<option value="Audi">Audi</option>
			<option value="Tata">Tata</option>
			<option value="Honda">Honda</option>
		</select>
		<br><br>
		<label for="age">Age</label>
		<input type="number" id="age" placeholder="age" required>
		<br><br>
		<label for="dob">DOB</label>
		<input type="date" id="dob" name="dob" required>

    <br><br>

    <label for="tel">Phone Number</label>
    <input type="tel" id="tel" name="tel" placeholder="xxx-xxx-xxxx">

    <br><br>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required>

    <br><br>
		<input type="checkbox" id="tos" placeholder="password" required>
		<label for="tos">I agree to the TOS</label>
		<br><br>
		<button type="submit">Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
